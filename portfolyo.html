<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Dijital Portfolyo - EBA</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="panel.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="auth-utils.js"></script>
  <style>
    .portfolio-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    .header-card { background: linear-gradient(135deg, #284B63, #4A748F); color: white; padding: 40px; border-radius: 24px; display: flex; align-items: center; gap: 30px; box-shadow: 0 10px 30px rgba(40,75,99,0.3); margin-bottom: 30px; position: relative; overflow: hidden; }
    .header-card::after { content: ''; position: absolute; top: -50px; right: -50px; width: 200px; height: 200px; background: rgba(255,255,255,0.1); border-radius: 50%; }
    .port-avatar { width: 120px; height: 120px; border-radius: 50%; border: 5px solid rgba(255,255,255,0.2); object-fit: cover; background: white; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .card-title { font-size: 18px; font-weight: 800; color: #284B63; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
    .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 15px; }
    .badge-item { text-align: center; }
    .badge-icon { width: 60px; height: 60px; object-fit: contain; margin-bottom: 5px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); }
    .badge-name { font-size: 10px; font-weight: 700; color: #4A748F; }
    .achievement-item { display: flex; align-items: center; gap: 15px; padding: 12px; background: #f8f9fa; border-radius: 12px; margin-bottom: 10px; }
    .ach-icon { width: 40px; height: 40px; background: #e3f2fd; color: #1976d2; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .ach-info h5 { margin: 0; color: #284B63; font-size: 14px; }
    .ach-info p { margin: 0; font-size: 11px; color: #888; }
    .score-badge { margin-left: auto; background: #2ecc71; color: white; padding: 4px 10px; border-radius: 20px; font-weight: 800; font-size: 12px; }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #4A748F; text-decoration: none; font-weight: 700; margin-bottom: 20px; transition: 0.3s; }
    .back-btn:hover { transform: translateX(-5px); }
  </style>
</head>
<body style="background:#f4f7f9;">
  <div class="portfolio-container">
    <a href="javascript:history.back()" class="back-btn"><i class="fa fa-arrow-left"></i> Geri Dön</a>
    
    <div class="header-card">
      <img id="u-img" src="" class="port-avatar" style="display:none;">
      <div id="u-icon" class="port-avatar" style="display:flex; align-items:center; justify-content:center; background:#eee; color:#ccc; font-size:60px;"><i class="fa fa-user"></i></div>
      <div>
        <h1 id="u-name" style="margin:0; font-size:32px; font-weight:900;">Yükleniyor...</h1>
        <p id="u-school" style="margin:5px 0 0; opacity:0.8; font-size:16px;"></p>
        <div style="display:flex; gap:20px; margin-top:15px;">
          <div style="background:rgba(255,255,255,0.2); padding:5px 15px; border-radius:20px; font-size:14px;"><i class="fa fa-star" style="color:#f1c40f;"></i> <span id="u-points">0</span> Puan</div>
          <div style="background:rgba(255,255,255,0.2); padding:5px 15px; border-radius:20px; font-size:14px;"><i class="fa fa-coins" style="color:#ffd700;"></i> <span id="u-coins">0</span> Coin</div>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-title"><i class="fa fa-award" style="color:#f1c40f;"></i> Rozet Koleksiyonu</div>
        <div id="badge-list" class="badge-grid">
          <div style="text-align:center; color:#ccc; grid-column: 1/-1; padding:20px;">Henüz rozet kazanılmamış.</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><i class="fa fa-chart-line" style="color:#2ecc71;"></i> En İyi Sınav Sonuçları</div>
        <div id="top-scores">
          <div style="text-align:center; color:#ccc; padding:20px;">Sınav sonucu bulunamadı.</div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:20px;">
      <div class="card-title"><i class="fa fa-star" style="color:#e74c3c;"></i> Öne Çıkan Başarılar</div>
      <div id="extra-stats" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:15px;">
        <div class="achievement-item">
          <div class="ach-icon"><i class="fa fa-book"></i></div>
          <div class="ach-info">
            <h5 id="stat-total-exams">0</h5>
            <p>Tamamlanan Sınav</p>
          </div>
        </div>
        <div class="achievement-item">
          <div class="ach-icon" style="background:#fff3e0; color:#ff9800;"><i class="fa fa-video"></i></div>
          <div class="ach-info">
            <h5 id="stat-video-time">0 dk</h5>
            <p>Video İzleme</p>
          </div>
        </div>
        <div class="achievement-item">
          <div class="ach-icon" style="background:#e8f5e9; color:#4caf50;"><i class="fa fa-comments"></i></div>
          <div class="ach-info">
            <h5 id="stat-social">0</h5>
            <p>Sosyal Paylaşım</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const cu = requireAuth();
      if(!cu) return;
      
      const tc = new URLSearchParams(window.location.search).get('tc') || cu.tc;
      
      // Kullanıcı Bilgileri
      const token = localStorage.getItem('authToken');
      const userRes = await fetch('/api/user-stats?tc=' + tc, { headers:{'Authorization':`Bearer ${token}`} });
      const userData = await userRes.json();
      if(userData.success) {
        const u = userData.user;
        const s = userData.stats || {};
        document.getElementById('u-name').textContent = u.name || 'Öğrenci';
        document.getElementById('u-school').textContent = (u.school || '') + ' | ' + (u.classNum || '');
        document.getElementById('u-points').textContent = u.points || 0;
        document.getElementById('u-coins').textContent = u.coins || 0;
        if(u.profilePic) {
          document.getElementById('u-img').src = u.profilePic;
          document.getElementById('u-img').style.display = 'block';
          document.getElementById('u-icon').style.display = 'none';
        }
        // İstatistikler
        document.getElementById('stat-total-exams').textContent = s.exam_count || 0;
        document.getElementById('stat-video-time').textContent = (s.video_minutes || 0) + ' dk';
        document.getElementById('stat-social').textContent = s.social_count || 0;
      }
      
      // Rozetler
      const badgeRes = await fetch('/api/user-badges?tc=' + tc, { headers:{'Authorization':`Bearer ${token}`} });
      const badgeData = await badgeRes.json();
      if(badgeData.success && badgeData.badges.length) {
        document.getElementById('badge-list').innerHTML = badgeData.badges.map(b => `
          <div class="badge-item">
            <div style="width:60px; height:60px; background:#f0f8ff; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 5px; box-shadow:0 4px 8px rgba(0,0,0,0.05);">
              <i class="fa ${b.icon || 'fa-award'}" style="color:#f39200; font-size:24px;"></i>
            </div>
            <div class="badge-name">${b.name}</div>
          </div>
        `).join('');
      }
      
      // Sınavlar
      const testRes = await fetch('/api/test-results?tc=' + tc, { headers:{'Authorization':`Bearer ${token}`} });
      const testData = await testRes.json();
      if(testData.success && testData.tests.length) {
        const top = testData.tests.sort((a,b) => (b.score/b.total) - (a.score/a.total)).slice(0, 5);
        document.getElementById('top-scores').innerHTML = top.map(t => `
          <div class="achievement-item">
            <div class="ach-icon" style="background:#e8f5e9; color:#2ecc71;"><i class="fa fa-check"></i></div>
            <div class="ach-info">
              <h5>${t.title}</h5>
              <p>${t.subject} · ${new Date(t.takenAt).toLocaleDateString('tr-TR')}</p>
            </div>
            <div class="score-badge">%${Math.round(t.score*100/t.total)}</div>
          </div>
        `).join('');
      }

      // İstatistikler (Zaten userData içinde yüklendi)
    });
  </script>
</body>
</html>
