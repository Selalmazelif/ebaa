<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Sınavlar - EBA</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="panel.css">
  <script src="auth-utils.js"></script>
  <script>requireAuth();</script>
</head>
<body>
  <div class="sidebar">
    <div class="logo">EBA</div>
    <div class="profile">
      <div class="profile-img-container" onclick="event.stopPropagation(); document.getElementById('picInput').click()" title="Fotoğrafı Değiştir">
        <div style="width:80px;height:80px;background:#fff;border-radius:50%;border:3px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0 auto 10px;position:relative;">
          <i class="fa fa-user" style="font-size:40px;color:#ccc;" id="default-avatar-icon"></i>
          <img src="" alt="" id="profile-img-display" style="display:none;width:100%;height:100%;object-fit:cover;z-index:2;position:relative;">
        </div>
        <div class="edit-overlay"><i class="fa fa-camera"></i></div>
      </div>
      <p id="profile-name" style="font-weight:600;"></p>
      <input id="picInput" type="file" accept="image/*" style="display:none;">
      <button id="logoutBtn" style="margin-top:14px;padding:6px 14px;background:#fff;color:#4A748F;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:12px;">Çıkış</button>
    </div>
        <ul id="sidebar-menu">
      <li><a href="ogrenci-panel.html"><i class="fa-solid fa-house"></i> Ana Sayfa</a></li>
      <li><a href="dersler.html"><i class="fa-solid fa-book"></i> Dersler</a></li>
      <li><a href="canli-ders.html"><i class="fa-solid fa-video"></i> Canlı Ders</a></li>
      <li><a href="kitaplar.html"><i class="fa-solid fa-file"></i> Kitaplar</a></li>
      <li><a href="sinavlar.html" class="active"><i class="fa-solid fa-pen"></i> Sınavlar</a></li>
      <li><a href="portfolyo.html"><i class="fa-solid fa-id-card"></i> Portfolyo</a></li>
      <li><a href="kütüphane.html"><i class="fa-solid fa-building-columns"></i> Kütüphane</a></li>
      <li><a href="whiteboard.html"><i class="fa-solid fa-chalkboard"></i> Akıllı Tahta</a></li>
      <li><a href="yarisma.html"><i class="fa-solid fa-bolt"></i> 1v1 Yarışma</a></li>
      <li><a href="ogrenci-panel.html?modal=shop"><i class="fa-solid fa-store"></i> EBA Market</a></li>
      <li><a href="ogrenci-panel.html?modal=avatar"><i class="fa-solid fa-user-ninja"></i> Avatarım</a></li>
      <li><a href="ayarlar.html"><i class="fa-solid fa-gear"></i> Ayarlar</a></li>
    </ul>
  </div>

  <div class="main">
    <div class="banner" style="margin:20px; background:#284B63; border-radius:15px; padding:30px; color:white; display:flex; justify-content:space-between; align-items:center;">
      <div>
        <h2>Sınavlar</h2>
        <p>Aktif sınavlarınız ve sonuçlarınız</p>
      </div>
    </div>
    <div id="quiz-list" style="padding:20px; display:grid; gap:15px;">
       <p style="color:#888;">Sınavlar yükleniyor...</p>
    </div>
  </div>

  <script>
    const user = requireAuth();
    if (user) {
      document.getElementById('profile-name').textContent = user.name;
      document.getElementById('logoutBtn').onclick = logout;
      
      async function loadQuizzes() {
        try {
          const res = await ebaFetch('/api/quizzes?school=' + encodeURIComponent(user.school));
          const data = await res.json();
          const list = document.getElementById('quiz-list');
          if(data.success && data.quizzes.length) {
            list.innerHTML = data.quizzes.map(q => '<div class=\"card\" style=\"background:white; padding:20px; border-radius:12px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 4px 10px rgba(0,0,0,0.05);\"><div style=\"text-align:left;\"><h3 style=\"margin:0; color:#284B63;\">' + q.title + '</h3><p style=\"font-size:12px; color:#888; margin-top:5px;\">' + q.subject + ' | Süre: ' + q.time_limit + ' dk</p></div><button onclick=\"location.href=\'quiz.html?id=' + q.id + '\'\" style=\"background:#2ecc71; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:700;\">Sınava Başla</button></div>').join('');
          } else {
            list.innerHTML = '<p style=\"color:#888;\">Şu an aktif sınav bulunmuyor.</p>';
          }
        } catch(e) {
          document.getElementById('quiz-list').innerHTML = '<p style=\"color:#e74c3c;\">Sınavlar yüklenirken bir hata oluştu.</p>';
        }
      }
      loadQuizzes();
    }
  </script>
</body>
</html>
