<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EBA Chat Sistemi</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="chat.css">
  <script src="auth-utils.js"></script>
  <script>requireAuth();</script>
</head>
<body>
  <header class="chat-header">
    <div class="chat-header-left">
      <button class="icon-btn" id="toggleSidebar"><i class="fa-solid fa-bars"></i></button>
      <div class="chat-logo">EBA Chat</div>
    </div>
    <div class="chat-header-right">
      <button class="icon-btn" id="openGroupModal" title="Grup Oluştur"><i class="fa-solid fa-users"></i></button>
      <button class="icon-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
      <a class="icon-btn" href="#" onclick="goToPanel()"><i class="fa-solid fa-house"></i></a>
    </div>
  </header>

  <div class="chat-app">
    <aside class="chat-sidebar">
      <div class="sidebar-search">
        <input id="conversationSearch" placeholder="Ara...">
      </div>
      <div class="sidebar-segment">
        <div class="segment-header">Bireysel</div>
        <div class="conversation-list" id="individualList"></div>
      </div>
      <div class="sidebar-segment">
        <div class="segment-header">Gruplar</div>
        <div class="conversation-list" id="groupList"></div>
      </div>
      <button class="primary-btn" id="createGroupBtn" style="width:90%; margin:10px auto; display:block;">+ Grup Oluştur</button>
    </aside>

    <main class="chat-main">
      <div class="chat-top" id="chatTop" style="cursor:pointer; padding:15px; border-bottom:1px solid #ddd;">
        <h2 id="chatTitle" style="margin:0;">Sohbet Seçin</h2>
        <p id="chatSubtitle" style="margin:0; font-size:12px; color:#666;">Mesajlaşmaya başlayın</p>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <form class="chat-input" id="chatForm">
        <button type="button" class="icon-btn" id="voiceBtn" title="Sesli Mesaj"><i class="fa-solid fa-microphone"></i></button>
        <input id="messageInput" type="text" placeholder="Mesajınızı yazın..." autocomplete="off">
        <button type="submit" class="send-btn">Gönder</button>
      </form>
    </main>
  </div>

  <!-- Grup Oluşturma Modalı -->
  <div class="modal" id="groupModal">
    <div class="modal-backdrop" onclick="closeModal('groupModal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>Grup Oluştur</h3>
        <button class="icon-btn" onclick="closeModal('groupModal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <input id="groupName" type="text" placeholder="Grup Adı" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin-bottom:15px;">
        <div id="userList" class="user-grid"></div>
      </div>
      <div class="modal-footer">
        <button class="secondary-btn" onclick="closeModal('groupModal')">İİptal</button>
        <button id="saveGroup" class="primary-btn">Grubu Oluştur</button>
      </div>
    </div>
  </div>

  <!-- Grup Detay Modalı -->
  <div class="modal" id="groupDetailsModal">
    <div class="modal-backdrop" onclick="closeModal('groupDetailsModal')"></div>
    <div class="modal-content" style="text-align:center;">
        <h3 id="groupDetailsName">Grup Detayları</h3>
        <p id="groupDetailsMemberCount" style="color:#666; margin-top:5px;">0 Üye</p>
        <div id="groupMembersList" class="user-grid" style="text-align:left; margin:20px 0;"></div>
        <div class="modal-footer" style="flex-direction:column; gap:10px;">
            <button id="leaveGroupBtn" style="background:#e53e3e; color:white;" class="primary-btn">Gruptan Ayrıl</button>
            <button class="secondary-btn" onclick="closeModal('groupDetailsModal')">Kapat</button>
        </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="chat.js"></script>
</body>
</html>
